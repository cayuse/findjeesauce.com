# bigballs nginx vhost for STAGING (test.findjeesauce.com → 127.0.0.1:9396).
# Install (on bigballs, with sudo), then let certbot add HTTPS:
#   sudo cp test.findjeesauce.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/test.findjeesauce.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d test.findjeesauce.com
server {
    listen 80;
    listen [::]:80;
    server_name test.findjeesauce.com;

    # Staging is never in search results (the app says so too).
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:9396;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
